name: siaganusa
description: "SiagaNusa - platform informasi dan respons bencana Indonesia."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Jaringan dan state
  dio: ^5.9.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3

  # Tampilan
  google_fonts: ^6.3.0
  cached_network_image: ^3.4.1

  # Peta dan lokasi
  flutter_map: ^8.2.0
  latlong2: ^0.9.1
  geolocator: ^14.0.0

  # Fitur lain
  flutter_local_notifications: ^19.0.0
  intl: ^0.20.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
